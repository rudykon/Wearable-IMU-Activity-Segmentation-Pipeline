site_name: Wearable IMU Activity Segmentation Pipeline
site_url: https://rudykon.github.io/Wearable-IMU-Activity-Segmentation-Pipeline/
site_description: >-
  Reproducible multi-scale activity segmentation for long-session wearable
  accelerometer and gyroscope streams, with Python research code and an
  on-device Android demo.
site_author: Kong Minghao

repo_name: rudykon/Wearable-IMU-Activity-Segmentation-Pipeline
repo_url: https://github.com/rudykon/Wearable-IMU-Activity-Segmentation-Pipeline
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font: false
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search:
      lang: en

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rudykon
      name: rudykon on GitHub
  generator: false

copyright: Copyright &copy; 2026 Kong Minghao · Apache-2.0

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quick start: getting-started/quickstart.md
  - Pipeline:
      - Architecture: guide/pipeline.md
      - Data: guide/data.md
      - Training: guide/training.md
      - Inference: guide/inference.md
      - Evaluation: guide/evaluation.md
  - Deployment:
      - Android app: deployment/android.md
  - Reference:
      - Python API: reference/api.md
      - Data & model assets: reference/assets.md
      - Citation & license: reference/citation.md

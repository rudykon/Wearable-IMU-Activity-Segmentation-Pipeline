site_name: Wearable IMU Activity Segmentation Pipeline
site_url: https://rudykon.github.io/Wearable-IMU-Activity-Segmentation-Pipeline/
site_description: Convert continuous wrist IMU signals into timestamped activity records.
site_author: Kong Minghao

repo_name: rudykon/Wearable-IMU-Activity-Segmentation-Pipeline
repo_url: https://github.com/rudykon/Wearable-IMU-Activity-Segmentation-Pipeline
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  logo: assets/logo-dark.svg
  favicon: assets/favicon.svg
  font: false
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search:
      lang: en
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 简体中文
          build: true
          site_name: 可穿戴 IMU 片段级活动识别系统
          site_description: 将连续腕部 IMU 信号转换为带时间戳的活动记录。
          theme:
            palette:
              - media: "(prefers-color-scheme: light)"
                scheme: default
                primary: custom
                accent: custom
                toggle:
                  icon: material/weather-night
                  name: 切换至深色模式
              - media: "(prefers-color-scheme: dark)"
                scheme: slate
                primary: custom
                accent: custom
                toggle:
                  icon: material/weather-sunny
                  name: 切换至浅色模式
          nav_translations:
            Overview: 概览
            Method: 方法
            Main results: 主要结果
            Supplementary analyses: 补充分析
            Reproduce: 复现
            Installation: 安装
            Quickstart: 快速开始
            Data: 数据
            Data and assets: 数据与资产
            Training: 训练
            Inference: 推理
            Evaluation: 评估
            Results: 结果
            Demo: 演示
            Android: Android
            API: API
            Citation: 引用
            GitHub: GitHub

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css
  - stylesheets/showcase.css
  - stylesheets/demo-walkthrough.css
  - stylesheets/math.css

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rudykon/Wearable-IMU-Activity-Segmentation-Pipeline
      name: Project source on GitHub
  generator: false

copyright: Copyright &copy; 2026 Kong Minghao · Apache-2.0

nav:
  - Overview: index.md
  - Method: guide/pipeline.md
  - Results:
      - Main results: research/paper.md
      - Supplementary analyses: research/supplementary.md
  - Reproduce:
      - Overview: reproduce.md
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - Data: guide/data.md
      - Data and assets: reference/assets.md
      - Training: guide/training.md
      - Inference: guide/inference.md
      - Evaluation: guide/evaluation.md
      - Android: deployment/android.md
      - API: reference/api.md
      - Citation: reference/citation.md
  - Demo: deployment/hugging-face.md
  - GitHub: https://github.com/rudykon/Wearable-IMU-Activity-Segmentation-Pipeline

site_name: Wearable IMU Activity Segmentation Pipeline
site_url: https://rudykon.github.io/Wearable-IMU-Activity-Segmentation-Pipeline/
site_description: >-
  Reproducible multi-scale activity segmentation for long-session wearable
  accelerometer and gyroscope streams, with Python research code and an
  on-device Android demo.
site_author: Kong Minghao

repo_name: rudykon/Wearable-IMU-Activity-Segmentation-Pipeline
repo_url: https://github.com/rudykon/Wearable-IMU-Activity-Segmentation-Pipeline
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font: false
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search:
      lang: en
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 简体中文
          build: true
          site_name: 可穿戴 IMU 活动分割流水线
          site_description: >-
            面向长时可穿戴加速度计与陀螺仪数据的可复现多尺度活动分割流水线，
            包含 Python 研究代码与端侧 Android 演示应用。
          theme:
            palette:
              - media: "(prefers-color-scheme: light)"
                scheme: default
                primary: custom
                accent: custom
                toggle:
                  icon: material/weather-night
                  name: 切换至深色模式
              - media: "(prefers-color-scheme: dark)"
                scheme: slate
                primary: custom
                accent: custom
                toggle:
                  icon: material/weather-sunny
                  name: 切换至浅色模式
          nav_translations:
            Home: 首页
            Getting started: 快速上手
            Installation: 安装
            Quick start: 快速开始
            Pipeline: 流水线
            Architecture: 架构
            Data: 数据
            Training: 训练
            Inference: 推理
            Evaluation: 评估
            Deployment: 部署
            Android app: Android 应用
            Reference: 参考
            Python API: Python API
            Data & model assets: 数据与模型资产
            Citation & license: 引用与许可

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - "https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap"
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rudykon
      name: rudykon on GitHub
  generator: false

copyright: Copyright &copy; 2026 Kong Minghao · Apache-2.0

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quick start: getting-started/quickstart.md
  - Pipeline:
      - Architecture: guide/pipeline.md
      - Data: guide/data.md
      - Training: guide/training.md
      - Inference: guide/inference.md
      - Evaluation: guide/evaluation.md
  - Deployment:
      - Android app: deployment/android.md
  - Reference:
      - Python API: reference/api.md
      - Data & model assets: reference/assets.md
      - Citation & license: reference/citation.md

name: Documentation

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "package.json"
      - "package-lock.json"
      - "scripts/prepare_browser_demo.mjs"
      - "demo/examples/synthetic_activity_imu.tsv"
      - "tests/browser_demo_*.test.mjs"
      - "tests/test_docs_math.py"
      - ".github/workflows/deploy-docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "package.json"
      - "package-lock.json"
      - "scripts/prepare_browser_demo.mjs"
      - "demo/examples/synthetic_activity_imu.tsv"
      - "tests/browser_demo_*.test.mjs"
      - "tests/test_docs_math.py"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt

      - name: Prepare and test the local browser Demo
        run: |
          npm ci
          npm run prepare:browser-demo
          npm run test:browser-demo

      - name: Build documentation
        run: mkdocs build --strict

      - name: Validate rendered equations
        run: python tests/test_docs_math.py

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

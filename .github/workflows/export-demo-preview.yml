name: Export demo documentation figures

on:
  push:
    branches:
      - docs/demo-synthetic-walkthrough
    paths:
      - ".github/workflows/export-demo-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: docs/demo-synthetic-walkthrough

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install fonts and demo dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            numpy==1.26.4 \
            pandas==2.2.3 \
            scipy==1.15.3 \
            matplotlib==3.9.2 \
            gradio==6.25.0 \
            spaces \
            torch==2.8.0+cpu

      - name: Export real synthetic-example outputs
        env:
          MPLBACKEND: Agg
          TORCH_NUM_THREADS: "2"
        run: |
          python - <<'PY'
          from pathlib import Path

          import matplotlib.pyplot as plt
          from matplotlib import font_manager

          from demo.runtime import (
              make_signal_figure,
              make_timeline_figure,
              run_pipeline,
              segments_dataframe,
          )

          source = Path("demo/examples/synthetic_activity_imu.tsv")
          output = Path("docs/assets/demo")
          output.mkdir(parents=True, exist_ok=True)

          result = run_pipeline(
              source,
              fusion_mode="local_boundary",
              min_duration_sec=5,
              confidence_min=0.30,
              top_k=5,
          )

          signal_figure = make_signal_figure(result.recording)
          signal_figure.savefig(
              output / "synthetic-raw-signals.png",
              dpi=180,
              bbox_inches="tight",
              facecolor="white",
          )

          timeline_figure = make_timeline_figure(result)
          timeline_figure.savefig(
              output / "synthetic-activity-likelihood-timeline.png",
              dpi=180,
              bbox_inches="tight",
              facecolor="white",
          )

          records = segments_dataframe(result)
          records.to_csv(
              output / "synthetic-activity-records.csv",
              index=False,
              encoding="utf-8-sig",
          )

          cjk_candidates = [
              path for path in font_manager.findSystemFonts()
              if "NotoSansCJK" in Path(path).name
          ]
          if cjk_candidates:
              font_manager.fontManager.addfont(cjk_candidates[0])
              font_name = font_manager.FontProperties(fname=cjk_candidates[0]).get_name()
              plt.rcParams["font.family"] = font_name
              plt.rcParams["axes.unicode_minus"] = False

          figure, axis = plt.subplots(figsize=(12.8, 3.5))
          axis.axis("off")
          axis.set_title(
              "Activity records / 活动记录",
              loc="left",
              fontsize=16,
              fontweight="bold",
              color="#172b4d",
              pad=18,
          )
          axis.text(
              0,
              1.02,
              "synthetic_activity_imu.tsv · local_boundary · 5 s · confidence 0.30 · Top-K 5",
              transform=axis.transAxes,
              fontsize=10,
              color="#5b6573",
          )

          rows = [
              [
                  f"{row['Activity']} / {row['活动']}",
                  f"{row['Start (s)']:.2f}",
                  f"{row['End (s)']:.2f}",
                  f"{row['Duration (s)']:.2f}",
                  f"{row['Confidence']:.4f}",
              ]
              for _, row in records.iterrows()
          ]
          table = axis.table(
              cellText=rows,
              colLabels=[
                  "Activity / 活动",
                  "Start (s)",
                  "End (s)",
                  "Duration (s)",
                  "Confidence",
              ],
              cellLoc="left",
              colLoc="left",
              loc="center",
              colWidths=[0.27, 0.14, 0.14, 0.18, 0.16],
          )
          table.auto_set_font_size(False)
          table.set_fontsize(11)
          table.scale(1, 1.8)
          for (row_index, column_index), cell in table.get_celld().items():
              cell.set_edgecolor("#d9e1e8")
              cell.set_linewidth(0.8)
              if row_index == 0:
                  cell.set_facecolor("#edf3fb")
                  cell.set_text_props(weight="bold", color="#172b4d")
              else:
                  cell.set_facecolor("#ffffff" if row_index % 2 else "#f8fafc")
                  cell.set_text_props(color="#253858")
                  if column_index == 0:
                      cell.set_text_props(weight="bold", color="#3d6fb6")

          figure.tight_layout()
          figure.savefig(
              output / "synthetic-activity-records.png",
              dpi=180,
              bbox_inches="tight",
              facecolor="white",
          )
          plt.close(figure)

          summary = [
              f"samples={len(result.recording.data)}",
              f"duration_sec={result.recording.duration_sec:.1f}",
              f"sample_rate_hz={result.recording.sample_rate_hz:.1f}",
              f"timeline_points={len(result.timestamps)}",
              f"segments={len(result.segments)}",
              records.to_string(index=False),
          ]
          (output / "synthetic-run-summary.txt").write_text(
              "\n".join(summary),
              encoding="utf-8",
          )
          PY

      - name: Commit generated figures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/demo/
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "docs: add real synthetic demo result figures"
          git push origin HEAD:docs/demo-synthetic-walkthrough

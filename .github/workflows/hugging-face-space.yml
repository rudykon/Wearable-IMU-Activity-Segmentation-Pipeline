name: Sync Hugging Face Space

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hugging-face-space-production
  cancel-in-progress: true

jobs:
  sync:
    name: Create and synchronize public ZeroGPU Space
    runs-on: ubuntu-latest
    env:
      HF_SPACE_ID: config-h/Wearable-IMU-Activity-Segmentation-Pipeline
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Check out the complete repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Create the free ZeroGPU Gradio Space
        run: >-
          uvx hf repos create "${HF_SPACE_ID}"
          --type space
          --sdk gradio
          --flavor zero-a10g
          --public
          --exist-ok

      - name: Mirror GitHub main to Hugging Face
        run: >-
          uvx hf upload "${HF_SPACE_ID}" . .
          --type space
          --exclude ".git*"
          --exclude ".github*"
          --delete "*"
          --commit-message "Sync from ${GITHUB_REPOSITORY}"
          --commit-description "GitHub commit ${GITHUB_SHA}"
